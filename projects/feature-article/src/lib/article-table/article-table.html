<table pta-table>
    <thead>
    <tr>
        <th>Заголовок</th>
        <th style="width: 150px">Аннотации</th>
        <th style="width: 150px; text-align: center">Действия</th>
    </tr>
    </thead>
    <tbody>
        @for (article of articles(); track article.id) {
            <tr>
                <td><strong>{{ article.title }}</strong></td>
                <td>{{ article.annotationsCount }}</td>
                <td class="actions">
                    <button pta-button [routerLink]="[article.id]">
                        Просмотреть
                    </button>
                    <button pta-button [routerLink]="['edit', article.id]">
                        Редактировать
                    </button>
                </td>
            </tr>
        } @empty {
            <tr>
                <td colspan="3" class="empty-cell">
                    Статей пока нет. Создайте свою первую статью!
                </td>
            </tr>
        }
    </tbody>
</table>

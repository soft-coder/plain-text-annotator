@if (article(); as item) {
    <div class="view-container">
        <header class="view-header">
            <button pta-button (click)="goBack()">Назад</button>
            <div class="actions">
                <button pta-button [routerLink]="['..', 'edit', item.id]">
                    Редактировать
                </button>
                <button pta-button [variant]="'danger'" (click)="delete()">
                    Удалить
                </button>
            </div>
        </header>

        <main class="article-content">
            <h1 class="article-title">{{ item.title }}</h1>
            <main class="article-body" (mousedown)="onMouseDown($event)">
                @for (segment of segments(); track $index) {
                    @if (segment.annotation) {
                        <span
                            class="annotation-highlight"
                            [style.text-decoration-color]="segment.annotation.color"
                            [title]="segment.annotation.comment">
                            {{ segment.text }}
                        </span>
                    } @else {
                        <span class="text-segment" (mouseup)="onMouseUp()">
                            {{ segment.text }}
                        </span>
                    }
                }
            </main>
        </main>
    </div>
} @else {
    <div class="not-found">
        <p>Статья не найдена</p>
        <button pta-button (click)="goBack()">Вернуться к списку</button>
    </div>
}


@if (selectionRect()) {
    <pta-popover [anchor]="selectionRect()">
        <pta-annotation-editor
                [activeColor]="annotationColor()"
                [(comment)]="annotationComment"
                (updateColor)="updateAnnotationColor($event)"
                (updateComment)="updateAnnotationComment($event)"
        />
    </pta-popover>
}
